
$backgroundImage = ~/.config/hypr/images/lockscreen/hogwarts.jpg
$userIcon = ~/.config/hypr/images/icons/user-icon.png

background {
    monitor =
    path = $backgroundImage
    color = rgba(0, 0, 0, 0.0)
    blur_passes = 0
    blur_size = 0
    brightness = 1.0
    contrast = 1.0
    zindex = -1
}

shape {
    monitor =
    size = 500, 360
    rounding = 18
    border_size = 2
    border_color = rgba(255, 255, 255, 0.18)
    color = rgba(0, 0, 0, 0.82)
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

image {
    monitor =
    path = $userIcon
    size = 70
    rounding = 35
    border_size = 1
    border_color = rgba(255, 255, 255, 1)
    position = 0, 130
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = $USER
    color = rgb(255, 255, 255)
    font_size = 28
    position = 0, 62
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:60000] date +"%d/%m/%Y"
    color = rgb(255, 255, 255)
    font_size = 14
    position = 0, 30
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M:%S"
    color = rgba(255, 255, 255, 0.72)
    font_size = 12
    position = 0, -2
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:500] sh -c "if hyprctl devices 2>/dev/null | grep -qi 'capsLock: yes'; then echo 'Mayúsculas activas'; else echo ''; fi"
    font_size = 13
    position = 0, -42
    halign = center
    valign = center
    zindex = 1
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.25
    outer_color = rgba(255, 255, 255, 0.28)
    inner_color = rgba(0, 0, 0, 0.18)
    font_color = rgb(255, 255, 255)
    check_color = rgb(180, 180, 180)
    fail_color = rgb(220, 80, 80)
    capslock_color = rgb(255, 209, 102)
    fail_text = Contraseña incorrecta
    placeholder_text = Contraseña
    fade_on_empty = false
    position = 0, -84
    zindex = 1
}
